<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">College featured photo placeholder</title>
  <desc id="description">A blue and gold placeholder for a future college photograph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.58" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#1711d4" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#1711d4" stroke-linecap="round" stroke-linejoin="round" stroke-width="18">
    <rect x="420" y="260" width="360" height="280" rx="12"/>
    <path d="m450 495 108-108a38 38 0 0 1 54 0l73 73 29-29a38 38 0 0 1 54 0l12 12"/>
    <circle cx="684" cy="347" r="28"/>
  </g>
  <text x="600" y="650" fill="#1711d4" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4" text-anchor="middle">FEATURED PHOTO</text>
  <text x="600" y="700" fill="#64748b" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">College image coming soon</text>
  <rect x="468" y="745" width="264" height="8" rx="4" fill="#f2b705"/>
